name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current. requirements.txt allows a wide range, so the
        # matrix is what catches a dependency major bumping under the app.
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jsdom harness
        # Enables tests/test_formatters.py, which otherwise skips.
        run: npm install --prefix tests/formatters

      - name: Run tests
        env:
          SECRET_KEY: ci-test-key
        run: pytest tests -q --junitxml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml
