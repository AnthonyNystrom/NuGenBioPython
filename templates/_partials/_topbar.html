{# Top bar — brand (left), search (center), Workspace / help / user (right).
   Height 48px; see shell.css for styling. #}
<header class="app-topbar" role="banner">
    <a href="{{ url_for('index') }}" class="topbar-brand" aria-label="Go to Dashboard">
        <i class="fas fa-dna" aria-hidden="true"></i>
        <span>NuGenBioPython</span>
    </a>

    <div class="topbar-search" role="search">
        <i class="fas fa-search" aria-hidden="true"></i>
        <input type="search" id="topbarSearchInput"
               placeholder="Search tools (e.g. blast, motif, kegg)…"
               aria-label="Search tools"
               aria-controls="topbarSearchResults"
               aria-autocomplete="list" autocomplete="off">
        <ul id="topbarSearchResults" class="topbar-search-results" role="listbox" hidden></ul>
    </div>

    <div class="topbar-actions">
        <button type="button" class="topbar-btn" id="topbarWorkspaceBtn"
                aria-label="Toggle workspace" aria-expanded="false">
            <i class="fas fa-layer-group" aria-hidden="true"></i>
            <span class="topbar-btn-label">Workspace</span>
            <span class="topbar-badge" id="topbarWorkspaceBadge" hidden>0</span>
        </button>
        <button type="button" class="topbar-btn" data-action="toggleShortcutsHelp"
                aria-label="Keyboard shortcuts" title="Keyboard shortcuts (? key)">
            <i class="fas fa-question" aria-hidden="true"></i>
        </button>
        <a href="https://github.com/AnthonyNystrom/NuGenBioPython" target="_blank" rel="noopener"
           class="topbar-btn" title="View source on GitHub" aria-label="View source on GitHub">
            <i class="fab fa-github" aria-hidden="true"></i>
        </a>
    </div>
</header>
