
<script>
let currentResults = [];

document.getElementById('blastForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const sequence = document.getElementById('querySequence').value.trim();
    const fileInput = document.getElementById('sequenceFile');

    if (!sequence && (!fileInput.files || fileInput.files.length === 0)) {
        showAlert('Please enter a query sequence or upload a file', 'warning');
        return;
    }

    const formData = new FormData();

    // Add file if uploaded
    if (fileInput.files && fileInput.files.length > 0) {
        formData.append('sequenceFile', fileInput.files[0]);
    } else {
        formData.append('sequence', sequence);
    }

    formData.append('program', document.getElementById('blastProgram').value);
    formData.append('database', document.getElementById('database').value);
    formData.append('expect', document.getElementById('eValue').value);
    formData.append('hitlist_size', document.getElementById('maxHits').value);

    const wordSize = document.getElementById('wordSize').value;
    if (wordSize) formData.append('word_size', wordSize);

    const matrix = document.getElementById('matrixName').value;
    if (matrix) formData.append('matrix_name', matrix);

    formData.append('filter', document.getElementById('filterLowComplexity').checked ? 'T' : 'F');

    showLoading('blastBtn');

    fetch('/api/blast/search', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        hideLoading('blastBtn', '<i class="fas fa-rocket me-2"></i> Run BLAST Search');
        if (data.success) {
            currentResults = data.results;
            displayResults(data);
            displayStatistics(data.statistics);
            // Switch to results tab
            document.getElementById('results-tab').click();
        } else {
            showAlert('Error: ' + data.error, 'danger');
        }
    })
    .catch(error => {
        hideLoading('blastBtn', '<i class="fas fa-rocket me-2"></i> Run BLAST Search');
        showAlert('Error running BLAST: ' + error, 'danger');
    });
});

function displayResults(data) {
    const countBadge = document.getElementById('resultCount');
    countBadge.textContent = `${data.num_hits} hits`;
    countBadge.style.display = 'inline-block';

    window.blastCurrentResults = data.results;

    if (!data.results || data.results.length === 0) {
        document.getElementById('blastResults').innerHTML =
            '<p class="text-center text-muted">No significant hits found</p>';
        return;
    }

    const stats = data.statistics || {};
    const program = document.getElementById('blastProgram').value;
    const database = document.getElementById('database').value;

    const tiles = [
        { label: 'Hits',        value: data.num_hits },
        { label: 'Avg Identity', value: (stats.avg_identity ?? 0) + '%' },
        { label: 'Max Identity', value: (stats.max_identity ?? 0) + '%' },
        { label: 'Avg Score',    value: stats.avg_score ?? '—' },
        { label: 'Max Score',    value: stats.max_score ?? '—' },
    ];
    const tilesHtml = '<div class="rc-stats mb-3">' + tiles.map(t =>
        `<div class="rc-stat"><div class="rc-stat-value">${t.value}</div><div class="rc-stat-label">${t.label}</div></div>`
    ).join('') + '</div>';

    let tableRows = '';
    data.results.forEach((hit, index) => {
        const eValue = hit.e_value === 0 ? '0.0' : hit.e_value.toExponential(1);
        const displayScore = hit.bits ? Math.round(hit.bits) : (hit.score ? Math.round(hit.score) : 0);
        const title = hit.title ? (hit.title.length > 60 ? hit.title.substring(0, 60) + '…' : hit.title) : 'N/A';
        tableRows += `<tr>
            <td class="small">${hit.accession || 'N/A'}</td>
            <td class="small">${title}</td>
            <td class="text-center"><span class="badge bg-success">${displayScore}</span></td>
            <td class="small">${eValue}</td>
            <td class="text-center">${hit.identity_percent || 0}%</td>
            <td class="text-center"><button class="btn btn-sm btn-outline-warning" onclick="window.viewBlastAlignment(${index}); return false;">
                <i class="fas fa-align-left"></i> View
            </button></td>
        </tr>`;
    });
    const table = `<div class="table-responsive"><table class="table table-sm table-hover">
        <thead class="table-light"><tr><th>Accession</th><th>Title</th><th>Score (bits)</th><th>E-value</th><th>Identity</th><th>Action</th></tr></thead>
        <tbody>${tableRows}</tbody></table></div>`;

    const tsv = [
        'accession\ttitle\tbits\tscore\te_value\tidentity_percent\tidentities\talign_length\tgaps'
    ];
    data.results.forEach(hit => {
        tsv.push([
            hit.accession || '',
            (hit.title || '').replace(/\t/g, ' '),
            hit.bits ?? '',
            hit.score ?? '',
            hit.e_value ?? '',
            hit.identity_percent ?? '',
            hit.identities ?? '',
            hit.align_length ?? '',
            hit.gaps ?? '',
        ].join('\t'));
    });

    ResultsCard.mount('blastResults', {
        title: 'BLAST Search',
        meta: `${program.toUpperCase()} vs ${database} — ${data.num_hits} hits`,
        summary: tilesHtml + table,
        raw: JSON.stringify(data.results, null, 2),
        workspaceItem: { type: 'blast', name: `BLAST ${program} vs ${database} (${data.num_hits} hits)`, data: data.results },
        downloads: [
            { label: 'JSON', filename: 'blast-hits.json', text: JSON.stringify(data.results, null, 2), mime: 'application/json' },
            { label: 'TSV',  filename: 'blast-hits.tsv',  text: tsv.join('\n'), mime: 'text/tab-separated-values' },
        ],
    });
}

// Make viewAlignment globally accessible
window.viewBlastAlignment = function(index) {
    const results = window.blastCurrentResults || currentResults;

    if (!results || results.length === 0) {
        showAlert('No results available. Please run a BLAST search first.', 'warning');
        return;
    }

    if (index >= results.length) {
        showAlert('Invalid hit index', 'danger');
        return;
    }

    fetch(`/api/blast/alignment/${index}`)
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const alignDiv = document.getElementById('alignmentView');
            let html = `<div class="mb-3">
                <h6 class="text-warning"><i class="fas fa-dna"></i> ${data.hit.accession}</h6>
                <p class="small mb-2">${data.hit.title}</p>
                <div class="row small">
                    <div class="col-md-3"><strong>Score:</strong> ${data.hit.score} (${data.hit.bits} bits)</div>
                    <div class="col-md-3"><strong>E-value:</strong> ${data.hit.e_value.toExponential(2)}</div>
                    <div class="col-md-3"><strong>Identity:</strong> ${data.hit.identities}/${data.hit.align_length} (${data.hit.identity_percent}%)</div>
                    <div class="col-md-3"><strong>Gaps:</strong> ${data.hit.gaps}/${data.hit.align_length}</div>
                </div>
            </div>
            <pre class="bg-light p-3 small" style="font-family: monospace;">${data.alignment}</pre>`;

            alignDiv.innerHTML = html;
            document.getElementById('alignment-tab').click();
        } else {
            showAlert('Error: ' + (data.error || 'Unknown error'), 'danger');
        }
    })
    .catch(error => {
        showAlert('Error loading alignment: ' + error.message, 'danger');
    });
};

// Alias for backward compatibility
function viewAlignment(index) {
    window.viewBlastAlignment(index);
}

function displayStatistics(stats) {
    if (!stats || Object.keys(stats).length === 0) return;

    const statsDiv = document.getElementById('statistics');
    let html = '<div class="small">';
    html += `<p><strong>Total Hits:</strong> ${stats.total_hits}</p>`;
    html += `<p><strong>Avg Identity:</strong> ${stats.avg_identity}%</p>`;
    html += `<p><strong>Max Identity:</strong> ${stats.max_identity}%</p>`;
    html += `<p><strong>Avg Score:</strong> ${stats.avg_score}</p>`;
    html += `<p><strong>Max Score:</strong> ${stats.max_score}</p>`;
    html += '</div>';

    statsDiv.innerHTML = html;
}

function exportResults() {
    const format = document.getElementById('blastExportFormat').value;
    window.open(`/api/blast/export?format=${format}`, '_blank');
}
